<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro Vendite</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 20px; background-color: #f4f6f9; color: #333; }
    .container { max-width: 900px; margin: auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    h2 { color: #2c3e50; margin-top: 0; text-align: center; }
    
    /* Login Box */
    #loginBox { max-width: 380px; margin: 50px auto; padding: 25px; background: white; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
    #loginBox input { margin-bottom: 12px; }

    .form-group { margin-bottom: 12px; }
    label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.9em; }
    input, select, button { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; font-size: 0.95em; }
    
    button { background-color: #27ae60; color: white; border: none; font-weight: bold; cursor: pointer; transition: background 0.2s; margin-top: 5px; }
    button:hover { background-color: #219150; }
    
    .btn-edit { background-color: #f39c12; color: white; width: auto; padding: 5px 10px; border-radius: 4px; }
    .btn-delete { background-color: #e74c3c; color: white; width: auto; padding: 5px 10px; border-radius: 4px; }
    .btn-move { background-color: #3498db; color: white; width: auto; padding: 3px 8px; border-radius: 4px; font-size: 0.8em; }
    
    .filter-section { margin: 20px 0; background: #eef2f7; padding: 15px; border-radius: 8px; display: flex; align-items: center; gap: 10px; }
    .filter-section label { margin-bottom: 0; white-space: nowrap; }

    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #e1e8ed; padding: 10px; text-align: left; }
    th { background-color: #2c3e50; color: white; }
    tr:nth-child(even) { background-color: #f8f9fa; }
    
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid #eef2f7; padding-bottom: 10px; }
    .btn-logout { background-color: #7f8c8d; width: auto; padding: 6px 12px; font-size: 0.85em; }
  </style>
</head>
<body>

<!-- SCHERMATA LOGIN -->
<div id="loginBox">
  <h2>Accesso Cassa</h2>
  <div class="form-group">
    <input type="email" id="loginEmail" placeholder="Email" value="valerianodomenico.beep@gmail.com">
  </div>
  <div class="form-group">
    <input type="password" id="loginPassword" placeholder="Password">
  </div>
  <button onclick="effettuaLogin()">Sblocca Cassa</button>
</div>

<!-- CONTENUTO PRINCIPALE -->
<div class="container" id="appContent" style="display: none;">
  <div class="header-bar">
    <h2>Registro Vendite</h2>
    <button class="btn-logout" onclick="effettuaLogout()">Esci</button>
  </div>

  <!-- Form Inserimento / Modifica -->
  <input type="hidden" id="docId">
  <div style="display: grid; grid-template-columns: 1fr 2fr 1fr 1fr; gap: 10px;">
    <div class="form-group">
      <label>Data:</label>
      <input type="date" id="dataVendita">
    </div>
    <div class="form-group">
      <label>Prodotto / Vino:</label>
      <input type="text" id="prodotto" placeholder="Nome vino">
    </div>
    <div class="form-group">
      <label>Quantità:</label>
      <input type="number" id="quantita" placeholder="0">
    </div>
    <div class="form-group">
      <label>Prezzo Totale (€):</label>
      <input type="number" step="0.01" id="prezzo" placeholder="0.00">
    </div>
  </div>
  
  <button id="btnSalva" onclick="salvaVendita()">Aggiungi Vendita</button>
  <button id="btnAnnulla" onclick="resetForm()" style="background-color: #7f8c8d; display: none;">Annulla Modifica</button>

  <!-- Filtro per Mese -->
  <div class="filter-section">
    <label for="filtroMese"><strong>Filtra per Mese:</strong></label>
    <select id="filtroMese" onchange="renderTabella()">
      <option value="tutti">Tutti i mesi</option>
    </select>
  </div>

  <!-- Tabella Dati -->
  <table>
    <thead>
      <tr>
        <th style="width: 70px;">Ordine</th>
        <th>Data</th>
        <th>Prodotto</th>
        <th>Qtà</th>
        <th>Totale (€)</th>
        <th style="width: 150px;">Azioni</th>
      </tr>
    </thead>
    <tbody id="tabellaCorpo">
      <!-- Righe dinamiche -->
    </tbody>
  </table>
</div>

<!-- SDK Firebase v9 -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.1.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.1.0/firebase-auth.js";
  import { getFirestore, collection, addDoc, getDocs, updateDoc, deleteDoc, doc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.1.0/firebase-firestore.js";

  // Parametri Firebase configurati
  const firebaseConfig = {
    apiKey: "AIzaSyD-EXAMPLE_KEY_REPLACE_IF_NEEDED",
    authDomain: "registro-vendite-beep.firebaseapp.com",
    projectId: "registro-vendite-beep",
    storageBucket: "registro-vendite-beep.appspot.com",
    messagingSenderId: "1234567890",
    appId: "1:1234567890:web:exampleid"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const listaVendite = collection(db, "vendite");

  let venditeLocali = [];

  // Imposta la data di oggi come predefinita
  document.getElementById("dataVendita").valueAsDate = new Date();

  // Controllo Stato Autenticazione
  onAuthStateChanged(auth, (user) => {
    if (user) {
      document.getElementById("loginBox").style.display = "none";
      document.getElementById("appContent").style.display = "block";
      caricaVendite();
    } else {
      document.getElementById("loginBox").style.display = "block";
      document.getElementById("appContent").style.display = "none";
    }
  });

  window.effettuaLogin = async function() {
    const email = document.getElementById("loginEmail").value;
    const password = document.getElementById("loginPassword").value;
    try {
      await signInWithEmailAndPassword(auth, email, password);
    } catch (error) {
      alert("Errore di accesso: Password o Email errata.");
    }
  };

  window.effettuaLogout = function() {
    signOut(auth);
  };

  window.salvaVendita = async function() {
    const id = document.getElementById("docId").value;
    const data = document.getElementById("dataVendita").value;
    const prodotto = document.getElementById("prodotto").value;
    const quantita = Number(document.getElementById("quantita").value);
    const prezzo = Number(document.getElementById("prezzo").value);

    if (!data || !prodotto) {
      alert("Inserisci almeno la data e il nome del prodotto!");
      return;
    }

    if (id) {
      // Modifica
      await updateDoc(doc(db, "vendite", id), { data, prodotto, quantita, prezzo });
    } else {
      // Nuova vendita
      const ordine = venditeLocali.length + 1;
      await addDoc(listaVendite, { data, prodotto, quantita, prezzo, ordine, timestamp: new Date() });
    }

    resetForm();
    caricaVendite();
  };

  window.caricaVendite = async function() {
    const q = query(listaVendite, orderBy("ordine", "asc"));
    const snapshot = await getDocs(q);
    venditeLocali = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));

    popolaSelezionaMesi(venditeLocali);
    renderTabella();
  };

  function popolaSelezionaMesi(dati) {
    const select = document.getElementById("filtroMese");
    const valoreCorrente = select.value;
    const mesiSet = new Set();

    dati.forEach(v => {
      if (v.data) {
        const meseAnno = v.data.substring(0, 7); // Formato YYYY-MM
        mesiSet.add(meseAnno);
      }
    });

    select.innerHTML = '<option value="tutti">Tutti i mesi</option>';
    Array.from(mesiSet).sort().reverse().forEach(m => {
      const option = document.createElement("option");
      option.value = m;
      option.textContent = m;
      if (m === valoreCorrente) option.selected = true;
      select.appendChild(option);
    });
  }

  window.renderTabella = function() {
    const tbody = document.getElementById("tabellaCorpo");
    const filtro = document.getElementById("filtroMese").value;
    tbody.innerHTML = "";

    const datiFiltrati = venditeLocali.filter(v => filtro === "tutti" || (v.data && v.data.startsWith(filtro)));

    datiFiltrati.forEach((v) => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>
          <button class="btn-move" onclick="sposta('${v.id}', -1)">▲</button>
          <button class="btn-move" onclick="sposta('${v.id}', 1)">▼</button>
        </td>
        <td>${v.data}</td>
        <td>${v.prodotto}</td>
        <td>${v.quantita}</td>
        <td>€ ${v.prezzo ? Number(v.prezzo).toFixed(2) : '0.00'}</td>
        <td>
          <button class="btn-edit" onclick="preparaModifica('${v.id}')">✏️</button>
          <button class="btn-delete" onclick="elimina('${v.id}')">🗑️</button>
        </td>
      `;
      tbody.appendChild(tr);
    });
  };

  window.preparaModifica = function(id) {
    const v = venditeLocali.find(item => item.id === id);
    if (!v) return;

    document.getElementById("docId").value = v.id;
    document.getElementById("dataVendita").value = v.data;
    document.getElementById("prodotto").value = v.prodotto;
    document.getElementById("quantita").value = v.quantita;
    document.getElementById("prezzo").value = v.prezzo;

    document.getElementById("btnSalva").textContent = "Salva Modifiche";
    document.getElementById("btnAnnulla").style.display = "inline-block";
  };

  window.resetForm = function() {
    document.getElementById("docId").value = "";
    document.getElementById("dataVendita").valueAsDate = new Date();
    document.getElementById("prodotto").value = "";
    document.getElementById("quantita").value = "";
    document.getElementById("prezzo").value = "";

    document.getElementById("btnSalva").textContent = "Aggiungi Vendita";
    document.getElementById("btnAnnulla").style.display = "none";
  };

  window.elimina = async function(id) {
    if (confirm("Sei sicuro di voler eliminare questa vendita?")) {
      await deleteDoc(doc(db, "vendite", id));
      caricaVendite();
    }
  };

  window.sposta = async function(id, direzione) {
    const idx = venditeLocali.findIndex(v => v.id === id);
    const targetIdx = idx + direzione;

    if (targetIdx < 0 || targetIdx >= venditeLocali.length) return;

    const attuale = venditeLocali[idx];
    const destinazione = venditeLocali[targetIdx];

    const tempOrdine = attuale.ordine || idx + 1;
    attuale.ordine = destinazione.ordine || targetIdx + 1;
    destinazione.ordine = tempOrdine;

    await updateDoc(doc(db, "vendite", attuale.id), { ordine: attuale.ordine });
    await updateDoc(doc(db, "vendite", destinazione.id), { ordine: destinazione.ordine });

    caricaVendite();
  };
</script>

</body>
</html>
