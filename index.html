<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro Vendite</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; background-color: #f4f6f9; color: #333; }
    .container { max-width: 900px; margin: auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    h2 { color: #2c3e50; margin-top: 0; text-align: center; }
    
    /* Schermata Login */
    #loginBox { max-width: 400px; margin: 80px auto; padding: 35px 30px; background: white; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); text-align: center; }
    #loginBox h2 { color: #1e3a5f; margin-bottom: 25px; font-weight: 700; }
    
    .form-group { margin-bottom: 15px; text-align: left; }
    input, select { width: 100%; padding: 12px 15px; box-sizing: border-box; border: 1px solid #dcdfe6; border-radius: 6px; font-size: 0.95em; outline: none; }
    input:focus { border-color: #27ae60; }

    .btn-login { width: 100%; padding: 12px; background-color: #27ae60; color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 1em; cursor: pointer; transition: background 0.2s; margin-top: 10px; }
    .btn-login:hover { background-color: #219653; }
    
    button { padding: 10px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; }
    .btn-salva { background-color: #27ae60; color: white; width: 100%; }
    .btn-delete { background-color: #e74c3c; color: white; padding: 5px 10px; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #e1e8ed; padding: 10px; text-align: left; }
    th { background-color: #2c3e50; color: white; }
    tr:nth-child(even) { background-color: #f8f9fa; }
    
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid #eef2f7; padding-bottom: 10px; }
    .btn-logout { background-color: #7f8c8d; color: white; padding: 6px 12px; font-size: 0.85em; }
  </style>
</head>
<body>

<!-- SCHERMATA LOGIN -->
<div id="loginBox">
  <h2>Accesso Cassa</h2>
  
  <div class="form-group">
    <input type="email" id="loginEmail" value="valerianodomenico.beep@gmail.com" placeholder="Email">
  </div>
  <div class="form-group">
    <input type="password" id="loginPassword" placeholder="Password" onkeypress="if(event.key === 'Enter') effettuaLogin()">
  </div>
  <button class="btn-login" onclick="effettuaLogin()">Sblocca Cassa</button>
</div>

<!-- CONTENUTO APP -->
<div class="container" id="appContent" style="display: none;">
  <div class="header-bar">
    <h2>Registro Vendite</h2>
    <button class="btn-logout" onclick="effettuaLogout()">Blocca Cassa</button>
  </div>

  <!-- Form Inserimento Vendita -->
  <div style="display: grid; grid-template-columns: 1fr 2fr 1fr 1fr; gap: 10px;">
    <div>
      <label style="font-weight:600; font-size:0.85em;">Data:</label>
      <input type="date" id="dataVendita">
    </div>
    <div>
      <label style="font-weight:600; font-size:0.85em;">Prodotto / Vino:</label>
      <input type="text" id="prodotto" placeholder="Nome vino">
    </div>
    <div>
      <label style="font-weight:600; font-size:0.85em;">Quantità:</label>
      <input type="number" id="quantita" placeholder="0">
    </div>
    <div>
      <label style="font-weight:600; font-size:0.85em;">Prezzo Totale (€):</label>
      <input type="number" step="0.01" id="prezzo" placeholder="0.00">
    </div>
  </div>
  
  <br>
  <button class="btn-salva" onclick="salvaVendita()">Aggiungi Vendita</button>

  <!-- Tabella Vendite -->
  <table>
    <thead>
      <tr>
        <th>Data</th>
        <th>Prodotto</th>
        <th>Qtà</th>
        <th>Totale (€)</th>
        <th style="width: 80px;">Azione</th>
      </tr>
    </thead>
    <tbody id="tabellaCorpo">
      <!-- Righe dinamiche -->
    </tbody>
  </table>
</div>

<!-- SDK Firebase v9 -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.1.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.1.0/firebase-auth.js";
  import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.1.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCbNGUmM2nICS_D30b6XZ4WouFHr-AEItY",
    authDomain: "shop-39f14.firebaseapp.com",
    projectId: "shop-39f14",
    storageBucket: "shop-39f14.firebasestorage.app",
    messagingSenderId: "807596922271",
    appId: "1:807596922271:web:1b196d64df03d744a159aa"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const listaVendite = collection(db, "vendite");

  document.getElementById("dataVendita").valueAsDate = new Date();

  onAuthStateChanged(auth, (user) => {
    if (user) {
      document.getElementById("loginBox").style.display = "none";
      document.getElementById("appContent").style.display = "block";
      caricaVendite();
    } else {
      document.getElementById("loginBox").style.display = "block";
      document.getElementById("appContent").style.display = "none";
      document.getElementById("loginPassword").value = "";
    }
  });

  window.effettuaLogin = async function() {
    const email = document.getElementById("loginEmail").value;
    const password = document.getElementById("loginPassword").value;

    if (!email || !password) {
      alert("Inserisci email e password!");
      return;
    }

    try {
      await signInWithEmailAndPassword(auth, email, password);
    } catch (error) {
      alert("Credenziali errate.");
    }
  };

  window.effettuaLogout = function() {
    signOut(auth);
  };

  window.salvaVendita = async function() {
    const data = document.getElementById("dataVendita").value;
    const prodotto = document.getElementById("prodotto").value;
    const quantita = Number(document.getElementById("quantita").value);
    const prezzo = Number(document.getElementById("prezzo").value);

    if (!data || !prodotto) {
      alert("Compila i campi obbligatori!");
      return;
    }

    await addDoc(listaVendite, { data, prodotto, quantita, prezzo, timestamp: new Date() });

    document.getElementById("prodotto").value = "";
    document.getElementById("quantita").value = "";
    document.getElementById("prezzo").value = "";
    document.getElementById("dataVendita").valueAsDate = new Date();

    caricaVendite();
  };

  window.caricaVendite = async function() {
    const q = query(listaVendite, orderBy("timestamp", "desc"));
    const snapshot = await getDocs(q);
    const tbody = document.getElementById("tabellaCorpo");
    tbody.innerHTML = "";

    snapshot.docs.forEach((docSnapshot) => {
      const v = docSnapshot.data();
      const id = docSnapshot.id;
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${v.data}</td>
        <td>${v.prodotto}</td>
        <td>${v.quantita}</td>
        <td>€ ${v.prezzo ? Number(v.prezzo).toFixed(2) : '0.00'}</td>
        <td>
          <button class="btn-delete" onclick="elimina('${id}')">🗑️</button>
        </td>
      `;
      tbody.appendChild(tr);
    });
  };

  window.elimina = async function(id) {
    if (confirm("Sei sicuro di voler eliminare questa vendita?")) {
      await deleteDoc(doc(db, "vendite", id));
      caricaVendite();
    }
  };
</script>

</body>
</html>
